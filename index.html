<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>传统戏曲锣鼓经排练可视化</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p>Luogujing Rehearsal Grid</p>
        <h1>传统戏曲锣鼓经排练可视化</h1>
      </div>
      <div class="transport">
        <button id="playBtn" type="button" title="快捷键：空格">播放</button>
        <button id="stopBtn" type="button">停止</button>
        <button id="saveBtn" type="button">保存方案</button>
      </div>
    </header>

    <section class="controls">
      <label>剧目片段<input id="pieceName" placeholder="如：出场锣鼓-慢起"></label>
      <label>速度BPM<input id="bpmInput" type="number" min="40" max="220" value="96"></label>
      <label>难点批注<input id="noteInput" placeholder="如：第2小节小锣晚半拍，回车添加"></label>
    </section>

    <section class="queue-panel">
      <div class="queue-head">
        <h2>乐句队列</h2>
        <p class="queue-tip">逐句重复、自动接下一句，末句结束回到队首；空格 播放 / 暂停 / 从停下拍点继续。</p>
      </div>

      <form id="phraseForm" class="phrase-form">
        <label class="ph-name">乐句名称<input id="phraseName" placeholder="如：起霸-亮相" required></label>
        <label>起始小节
          <select id="phraseStart">
            <option value="1">第1小节</option>
            <option value="2">第2小节</option>
            <option value="3">第3小节</option>
            <option value="4">第4小节</option>
          </select>
        </label>
        <label>结束小节
          <select id="phraseEnd">
            <option value="1">第1小节</option>
            <option value="2" selected>第2小节</option>
            <option value="3">第3小节</option>
            <option value="4">第4小节</option>
          </select>
        </label>
        <label>重复遍数<input id="phraseRepeats" type="number" min="1" max="99" value="2"></label>
        <button type="submit">加入队列</button>
      </form>

      <div id="queueList" class="queue-list"></div>
    </section>

    <div id="nowPlaying" class="now-playing"></div>

    <section class="stage">
      <aside class="segments">
        <h2>已存方案</h2>
        <div id="savedList"></div>
      </aside>
      <section class="score">
        <div id="grid" class="grid"></div>
      </section>
      <aside class="notes">
        <h2>段落结构</h2>
        <div id="structure"></div>
        <h2>批注</h2>
        <div id="notesList"></div>
      </aside>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
